<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>여행 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one boarding-pass header per trip, then a station-timetable of days on the left and a narrow side column (packing list, budget) on the right. */
:root{
  --paper:#EAF0EC;
  --card:#F8FBF9;
  --ink:#14302B;
  --muted:#5A716B;
  --line:#C6D3CD;
  --accent:#F2AE1C;
  --accent-ink:#14302B;
  --danger:#B93A2E;
  --c-move:#2F74C8; --c-stay:#7C55C4; --c-food:#D0612F; --c-see:#1E8A68; --c-shop:#BC4686; --c-etc:#74837F;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1C19; --card:#162824; --ink:#E4EEEA; --muted:#93A8A2; --line:#2A413C;
    --accent:#F5B932; --accent-ink:#152420; --danger:#F08477;
    --c-move:#6FA8F0; --c-stay:#B094EC; --c-food:#F0926A; --c-see:#5CC9A3; --c-shop:#E586B8; --c-etc:#9BABA6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1C19; --card:#162824; --ink:#E4EEEA; --muted:#93A8A2; --line:#2A413C;
  --accent:#F5B932; --accent-ink:#152420; --danger:#F08477;
  --c-move:#6FA8F0; --c-stay:#B094EC; --c-food:#F0926A; --c-see:#5CC9A3; --c-shop:#E586B8; --c-etc:#9BABA6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;margin:0;font-weight:400}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:14px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.tab:hover{border-color:var(--ink)}
.tab[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.new{border-style:dashed;color:var(--muted)}
.tab.new:hover{color:var(--ink)}

.notice{border-left:4px solid var(--accent);background:var(--card);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}

/* boarding pass */
.ticket{display:grid;grid-template-columns:auto 1fr;background:var(--ink);color:var(--paper);border-radius:16px;overflow:hidden}
.stub{position:relative;background:var(--accent);color:var(--accent-ink);padding:22px 22px;min-width:132px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:2px dashed var(--ink)}
.stub::before,.stub::after{content:"";position:absolute;right:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.stub::before{top:-9px}.stub::after{bottom:-9px}
.stub .small{font-size:12px;font-weight:600;letter-spacing:.04em}
.stub .big{font-family:var(--mono);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.pass{padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pass h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5.2vw,44px);line-height:1.1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.pass .when{font-size:14px;opacity:.85;display:flex;flex-wrap:wrap;gap:4px 12px}
.pass .stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;border-top:1px solid color-mix(in srgb,var(--paper) 25%,transparent);padding-top:10px}
.pass .stats b{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.pass .acts{display:flex;flex-wrap:wrap;gap:8px}
.ghost{border:1px solid color-mix(in srgb,var(--paper) 45%,transparent);background:transparent;color:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px}
.ghost:hover{border-color:var(--paper)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:36px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.empty p{margin:0;color:var(--muted);max-width:46ch}

.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px;font-weight:600}
.btn:hover{filter:brightness(1.05)}
.btn.plain{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.plain:hover{border-color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);font-weight:500}

/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
#days{display:flex;flex-direction:column;gap:22px;min-width:0}
.day-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.day-head h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.day-head .date{color:var(--muted);font-size:14px}
.day-head .sub{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto 28px;column-gap:10px;align-items:start}
.item .time{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;padding-top:11px;color:var(--ink)}
.item .time.none{color:var(--muted)}
.item .col{position:relative;display:flex;flex-direction:column;align-items:flex-start;border-left:2px solid var(--line);min-width:0;padding-bottom:6px}
.item .col::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--dot,var(--c-etc));border:2px solid var(--paper)}
.item .body{display:flex;flex-direction:column;gap:1px;text-align:left;background:transparent;border:0;padding:9px 8px 5px 18px;min-width:0;width:100%;border-radius:0 8px 8px 0}
button.body:hover{background:var(--card)}
.lnk{font-size:13px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;overflow-wrap:anywhere}
.lnk:hover{text-decoration-color:var(--ink)}
.item .lnk{margin:0 8px 4px 18px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .memo{font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.item .cost{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding-top:12px;white-space:nowrap;color:var(--muted)}
.item .chk{padding-top:11px;display:flex;justify-content:flex-end}
.item.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.item.done .t,.item.done .memo,.item.done .time{color:var(--muted)}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--ink);margin:0}
.cat-move{--dot:var(--c-move)}.cat-stay{--dot:var(--c-stay)}.cat-food{--dot:var(--c-food)}.cat-see{--dot:var(--c-see)}.cat-shop{--dot:var(--c-shop)}.cat-etc{--dot:var(--c-etc)}
.none-yet{color:var(--muted);font-size:14px;padding:10px 0 4px 62px}
.add{margin:6px 0 0 62px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted)}
.add:hover{border-color:var(--ink);color:var(--ink)}
@media (max-width:480px){
  .item{grid-template-columns:46px minmax(0,1fr) 28px}
  .item .cost{grid-column:2;grid-row:2;padding:0 0 8px 20px;border-left:2px solid var(--line)}
  .item .chk{grid-column:3;grid-row:1}
  .none-yet,.add{margin-left:56px;padding-left:0}
  .add{padding-left:12px}
  .stub{min-width:104px;padding:18px 14px}
  .stub .big{font-size:24px}
  .pass{padding:16px}
}

/* side panels */
aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0;display:flex;align-items:baseline;gap:8px}
.panel h2 span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks li{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
.checks label{display:flex;gap:8px;flex:1;min-width:0;align-items:flex-start}
.checks label span{overflow-wrap:anywhere}
.checks li.done span{color:var(--muted);text-decoration:line-through}
.checks input{margin-top:3px;flex:none}
.x{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:18px;line-height:1.2;border-radius:4px}
.x:hover{color:var(--danger)}
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.places li{display:flex;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.places li:last-child{border-bottom:0}
.places .pl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.places .lnk,.places .nm{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.places .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.mini:hover{border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:6px}
.stack .btn{align-self:flex-end}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0}
input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
.total{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bud{display:flex;flex-direction:column;gap:8px}
.bud .line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.bud .amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bud .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bud .bar i{display:block;height:100%;background:var(--dot);border-radius:3px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* dialogs */
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,20,18,.55)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{font-size:15px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.dlg-acts .danger{margin-right:auto}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="brand">여행 수첩</p>
    <nav id="tripTabs" class="tabs" aria-label="여행 목록"></nav>
  </header>

  <div id="notice" class="notice" hidden></div>
  <section id="ticket" aria-live="polite"></section>

  <div id="cols" class="cols" hidden>
    <main id="days"></main>
    <aside>
      <section class="panel">
        <h2>가 볼 곳·맛집 <span id="placeCount"></span></h2>
        <ul id="placeList" class="places"></ul>
        <form id="placeForm" class="stack" autocomplete="off">
          <input type="text" id="plName" maxlength="60" required placeholder="이름 (예: 동네 고기국수집)" aria-label="장소 이름">
          <input type="text" id="plLink" maxlength="600" placeholder="지도 앱의 공유 링크 붙여 넣기" aria-label="장소 링크">
          <input type="text" id="plMemo" maxlength="120" placeholder="한 줄 메모 (선택)" aria-label="장소 메모">
          <button class="btn plain" type="submit">저장</button>
        </form>
      </section>
      <section class="panel">
        <h2>준비물 <span id="checkCount"></span></h2>
        <ul id="checkList" class="checks"></ul>
        <form id="checkForm" class="row" autocomplete="off">
          <input type="text" id="checkText" maxlength="80" placeholder="예: 여권, 충전기" aria-label="준비물 추가">
          <button class="btn plain" type="submit">추가</button>
        </form>
      </section>
      <section class="panel">
        <h2>예상 경비</h2>
        <div id="budget" class="bud"></div>
      </section>
    </aside>
  </div>
</div>

<dialog id="itemDlg" aria-labelledby="itemDlgTitle">
  <form id="itemForm" autocomplete="off">
    <h2 id="itemDlgTitle">일정 추가</h2>
    <label class="f">무엇을 하나요
      <input type="text" id="itTitle" maxlength="80" required placeholder="예: 성산일출봉 오르기">
    </label>
    <div class="two">
      <label class="f">날짜
        <select id="itDay"></select>
      </label>
      <label class="f">시간
        <input type="time" id="itTime">
      </label>
    </div>
    <label class="f">장소
      <input type="text" id="itPlace" maxlength="80" placeholder="예: 서귀포시 성산읍">
    </label>
    <label class="f">링크 (네이버 지도, 블로그 등)
      <input type="text" id="itLink" maxlength="600" placeholder="공유 링크를 붙여 넣으세요">
    </label>
    <div class="two">
      <label class="f">분류
        <select id="itCat">
          <option value="see">관광</option>
          <option value="food">식사</option>
          <option value="move">이동</option>
          <option value="stay">숙소</option>
          <option value="shop">쇼핑</option>
          <option value="etc">기타</option>
        </select>
      </label>
      <label class="f">예상 비용 (원)
        <input type="number" id="itCost" min="0" step="1000" inputmode="numeric" placeholder="0">
      </label>
    </div>
    <label class="f">메모
      <textarea id="itMemo" maxlength="400" placeholder="예약 번호, 주의할 점 등"></textarea>
    </label>
    <div class="dlg-acts">
      <button type="button" class="btn danger" id="itDelete" hidden>삭제</button>
      <button type="button" class="btn plain" data-act="close-dlg">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>
  </form>
</dialog>

<dialog id="tripDlg" aria-labelledby="tripDlgTitle">
  <form id="tripForm" autocomplete="off">
    <h2 id="tripDlgTitle">새 여행</h2>
    <label class="f">여행 이름
      <input type="text" id="trName" maxlength="40" required placeholder="예: 겨울 제주 가족여행">
    </label>
    <label class="f">여행지
      <input type="text" id="trDest" maxlength="40" placeholder="예: 제주도">
    </label>
    <div class="two">
      <label class="f">가는 날
        <input type="date" id="trStart" required>
      </label>
      <label class="f">오는 날
        <input type="date" id="trEnd" required>
      </label>
    </div>
    <div class="dlg-acts">
      <button type="button" class="btn danger" id="trDelete" hidden>여행 삭제</button>
      <button type="button" class="btn plain" data-act="close-dlg">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script>
(function(){
  'use strict';
  /* Where the shared plan is kept. Everyone who opens this page reads and writes here. */
  var DB_URL = 'https://sohnpark-cde70-default-rtdb.firebaseio.com';
  var ROOT = DB_URL.replace(/\/+$/, '') + '/plan';

  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var CATS = {see:'관광', food:'식사', move:'이동', stay:'숙소', shop:'쇼핑', etc:'기타'};
  var WD = '일월화수목금토';

  var state = { status:'loading', trips:[], tripId:null, items:[], checks:[], places:[] };
  var tree = {};
  var es = null, loadTimer = null, retryTimer = null;
  var editingItem = null, editingTrip = null;

  /* ---------- helpers ---------- */
  function parseD(s){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function fmtK(s){ var d = parseD(s); return d ? (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')' : ''; }
  function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function tripDays(t){
    var a = parseD(t.start), b = parseD(t.end) || a, out = [];
    if(!a) return out;
    var d = new Date(a), n = 0;
    while(d <= b && n < 60){ out.push(iso(d)); d.setDate(d.getDate()+1); n++; }
    return out;
  }
  function dday(t){
    var a = parseD(t.start); if(!a) return {big:'--', small:'날짜 미정'};
    var b = parseD(t.end) || a, now = today(), diff = Math.round((a - now) / 864e5);
    if(diff > 0) return {big:'D-' + diff, small:'출발까지'};
    if(now <= b) return {big:(Math.round((now - a) / 864e5) + 1) + '일차', small:'여행 중'};
    return {big:'완료', small:'다녀온 여행'};
  }
  function won(n){ return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
  function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function cat(c){ return Object.prototype.hasOwnProperty.call(CATS, c) ? c : 'etc'; }
  function curTrip(){ for(var i=0;i<state.trips.length;i++) if(state.trips[i].id === state.tripId) return state.trips[i]; return null; }
  function editable(){ return state.status === 'ready' || state.status === 'reconnecting'; }
  function sortItems(a,b){ return String(a.time || '99').localeCompare(String(b.time || '99')) || (a.createdAt || 0) - (b.createdAt || 0); }
  function find(list, id){ for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i]; return null; }

  /* Pull the first web address out of whatever was pasted (map apps share "name + address + link" as one text). */
  function cleanUrl(s){
    s = String(s || '').trim(); if(!s) return '';
    var m = /https?:\/\/[^\s<>"']+/i.exec(s), raw = m ? m[0] : (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s) ? 'https://' + s : '');
    if(!raw) return '';
    try { var u = new URL(raw); return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : ''; } catch(e){ return ''; }
  }
  function linkLabel(u){
    try {
      var url = new URL(u), h = url.hostname.replace(/^www\./, '');
      if(h === 'map.naver.com' || /(^|\.)place\.naver\.com$/.test(h)) return '네이버 지도';
      if(h === 'naver.me') return '네이버';
      if(h === 'map.kakao.com' || h === 'place.map.kakao.com' || h === 'kko.to') return '카카오맵';
      if(h === 'maps.app.goo.gl' || /^maps\.google\./.test(h) || (/(^|\.)google\./.test(h) && url.pathname.indexOf('/maps') === 0)) return '구글 지도';
      return h;
    } catch(e){ return '링크'; }
  }
  function anchor(u, text, cls){ return '<a class="' + cls + '" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + ' ↗</a>'; }

  var toastTimer;
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600); }

  /* ---------- shared store ---------- */
  /* The page keeps a local copy of the whole plan (tree). The server streams every change, from any phone, into it. */
  function setAt(path, data){
    var parts = String(path || '').split('/').filter(Boolean);
    if(!parts.length){ tree = (data && typeof data === 'object') ? data : {}; return; }
    var node = tree;
    for(var i=0;i<parts.length-1;i++){
      if(!node[parts[i]] || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
      node = node[parts[i]];
    }
    if(data === null || data === undefined) delete node[parts[parts.length-1]]; else node[parts[parts.length-1]] = data;
  }
  function list(o){
    return Object.keys(o || {}).map(function(k){ var v = o[k]; if(!v || typeof v !== 'object') return null; var c = Object.assign({}, v); c.id = k; return c; }).filter(Boolean);
  }
  function has(id){ return !!id && state.trips.some(function(t){ return t.id === id; }); }
  function derive(){
    state.trips = list(tree.trips).sort(function(a,b){ return String(a.start || '9').localeCompare(String(b.start || '9')) || (a.createdAt || 0) - (b.createdAt || 0); });
    chooseTrip();
    var id = state.tripId;
    state.items = id ? list((tree.items || {})[id]) : [];
    state.checks = id ? list((tree.checks || {})[id]) : [];
    state.places = id ? list((tree.places || {})[id]) : [];
  }
  function refresh(){ derive(); render(); }

  function chooseTrip(){
    if(has(state.tripId)) return;
    var h = location.hash.slice(1), saved = null;
    try { saved = localStorage.getItem('trip-open'); } catch(e){}
    var id = has(h) ? h : has(saved) ? saved : null;
    if(!id && state.trips.length){
      var t0 = iso(today());
      var next = state.trips.filter(function(t){ return (t.end || t.start || '') >= t0; })[0];
      id = (next || state.trips[state.trips.length - 1]).id;
    }
    openTrip(id);
  }
  function openTrip(id){
    if(state.tripId === id) return;
    state.tripId = id || null;
    if(!id) return;
    try { localStorage.setItem('trip-open', id); } catch(e){}
    if(location.hash.slice(1) !== id){ try { location.hash = id; } catch(e){} }
  }

  function send(method, path, data){
    var opt = { method: method };
    if(method !== 'DELETE') opt.body = JSON.stringify(data);
    return fetch(ROOT + (path ? '/' + path : '') + '.json', opt)
      .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return true; })
      .catch(function(){ toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'); connect(); return false; });
  }
  function put(path, data){ setAt(path, data); refresh(); return send('PUT', path, data); }
  function del(path){ setAt(path, null); refresh(); return send('DELETE', path); }

  function applyEvent(e, isPatch){
    var msg; try { msg = JSON.parse(e.data); } catch(err){ return; }
    if(!msg) return;
    if(isPatch && msg.data && typeof msg.data === 'object') Object.keys(msg.data).forEach(function(k){ setAt((msg.path || '') + '/' + k, msg.data[k]); });
    else setAt(msg.path, msg.data);
    clearTimeout(loadTimer); state.status = 'ready'; refresh();
  }
  function connect(){
    clearTimeout(retryTimer); clearTimeout(loadTimer);
    if(es){ try { es.close(); } catch(e){} es = null; }
    if(typeof EventSource === 'undefined'){ state.status = 'error'; render(); return; }
    loadTimer = setTimeout(function(){ if(state.status === 'loading'){ state.status = 'slow'; render(); } }, 10000);
    var src = es = new EventSource(ROOT + '.json');
    src.addEventListener('put', function(e){ applyEvent(e, false); });
    src.addEventListener('patch', function(e){ applyEvent(e, true); });
    var denied = function(){ state.status = 'denied'; try { src.close(); } catch(e){} render(); };
    src.addEventListener('cancel', denied);
    src.addEventListener('auth_revoked', denied);
    src.onerror = function(){
      if(src !== es) return;
      if(src.readyState === 2){ state.status = 'error'; clearTimeout(retryTimer); retryTimer = setTimeout(connect, 15000); }
      else if(state.status === 'ready'){ state.status = 'reconnecting'; }
      render();
    };
  }

  /* ---------- render ---------- */

    else if(state.status === 'error') msg = '저장소에 연결하지 못했어요. 인터넷 연결을 확인해 주세요. 잠시 후 다시 연결해 볼게요.';
    else if(state.status === 'slow') msg = '저장소 응답이 늦어지고 있어요. 조금만 기다려 주세요.';

  /* ---------- copy / share ---------- */
  function planText(){
    var t = curTrip(); if(!t) return '';
    var days = tripDays(t), by = {}, out = [];
    state.items.forEach(function(it){ var k = days.indexOf(it.day) >= 0 ? it.day : ''; (by[k] = by[k] || []).push(it); });
    out.push((t.name || '') + (t.dest ? ' (' + t.dest + ')' : ''));
    if(t.start) out.push(fmtK(t.start) + (t.end && t.end !== t.start ? ' ~ ' + fmtK(t.end) : ''));
    var line = function(it){ return '- ' + (it.time ? it.time + ' ' : '') + (it.title || '') + (it.place ? ' · ' + it.place : '') + (Number(it.cost) ? ' · ' + won(it.cost) : '') + (it.memo ? '\n  ' + String(it.memo).replace(/\n/g, '\n  ') : '') + (cleanUrl(it.link) ? '\n  ' + cleanUrl(it.link) : ''); };
    days.forEach(function(d,i){
      out.push('', '[' + (i+1) + '일차 · ' + fmtK(d) + ']');
      var l = (by[d] || []).sort(sortItems);
      if(l.length) l.forEach(function(it){ out.push(line(it)); }); else out.push('- (일정 없음)');
    });
    if((by[''] || []).length){ out.push('', '[날짜 미정]'); by[''].sort(sortItems).forEach(function(it){ out.push(line(it)); }); }
    var total = state.items.reduce(function(s,i){ return s + (Number(i.cost) || 0); }, 0);
    if(total) out.push('', '예상 경비 합계: ' + won(total));
    if(state.places.length){ out.push('', '[가 볼 곳·맛집]'); state.places.forEach(function(p){ out.push('- ' + (p.name || '') + (p.memo ? ' · ' + p.memo : '') + (cleanUrl(p.link) ? '\n  ' + cleanUrl(p.link) : '')); }); }
    if(state.checks.length) out.push('', '준비물: ' + state.checks.map(function(c){ return c.text + (c.done ? '(완료)' : ''); }).join(', '));
    return out.join('\n');
  }
  function copyText(text, okMsg){
    try { navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, function(){ toast('복사하지 못했어요.'); }); }
    catch(err){ toast('복사하지 못했어요.'); }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el) return;
    var act = el.dataset.act, id = el.dataset.id, tid = state.tripId;
    if(act === 'open-trip'){ openTrip(id); refresh(); }
    else if(act === 'new-trip'){ openTripDlg(null); }
    else if(act === 'edit-trip'){ openTripDlg(curTrip()); }
    else if(act === 'new-item'){ openItemDlg(null, el.dataset.day); }
    else if(act === 'edit-item'){ var it = find(state.items, id); if(it) openItemDlg(it); }
    else if(act === 'close-dlg'){ hide(el.closest('dialog')); }
    else if(act === 'del-place'){ if(tid) del('places/' + tid + '/' + id); }
    else if(act === 'plan-place'){ var pl = find(state.places, id); if(pl) openItemDlg(null, '', pl); }
    else if(act === 'del-check'){ if(tid) del('checks/' + tid + '/' + id); }
    else if(act === 'copy-plan'){ copyText(planText(), '일정을 복사했어요. 메신저에 붙여 넣으세요.'); }
    else if(act === 'share-page'){
      var t = curTrip(), url = location.href;
      if(navigator.share){ navigator.share({ title: t ? t.name : document.title, url: url }).catch(function(){}); }
      else copyText(url, '링크를 복사했어요. 메신저에 붙여 넣으세요.');
    }
  });

  document.addEventListener('change', function(e){
    var el = e.target; if(!el.dataset || !el.dataset.act) return;
    var id = el.dataset.id, tid = state.tripId; if(!tid) return;
    if(el.dataset.act === 'toggle-item'){ if(find(state.items, id)) put('items/' + tid + '/' + id + '/done', el.checked); }
    else if(el.dataset.act === 'toggle-check'){ if(find(state.checks, id)) put('checks/' + tid + '/' + id + '/done', el.checked); }
  });

  window.addEventListener('hashchange', function(){
    var h = location.hash.slice(1);
    if(h && h !== state.tripId && has(h)){ openTrip(h); refresh(); }
  });
  window.addEventListener('online', function(){ if(state.status !== 'ready') connect(); });

  render();
  connect();
})();
</script>
</body>
</html>
